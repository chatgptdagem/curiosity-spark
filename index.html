<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Curiosity Spark - Daily Deep Dive</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-history: #b45309;
            --accent-science: #0369a1;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        main {
            max-width: 650px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .filter-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--text-main);
            color: white;
            border-color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .badge.history { background: #fef3c7; color: var(--accent-history); }
        .badge.science { background: #e0f2fe; color: var(--accent-science); }

        .timer-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .timer-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .hook-box {
            font-style: italic;
            font-size: 1.1rem;
            color: var(--text-main);
            border-left: 3px solid var(--border-color);
            padding-left: 1rem;
            margin: 1rem 0;
        }

        .deep-dive p {
            margin: 0 0 1rem 0;
        }

        .quiz-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 2rem;
        }

        .quiz-options {
            display: grid;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .quiz-opt {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .quiz-opt:hover { background: #f1f5f9; }

        .quiz-opt.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #14532d;
        }

        .quiz-opt.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        .feedback {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .read-more a, .attribution a { color: var(--accent-science); }

        .attribution {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .link-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--accent-science);
            text-decoration: underline;
        }

        .key-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            margin: 0.75rem 0;
        }

        .error { color: #dc2626; font-size: 0.9rem; }
        .muted { color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>The Curiosity Spark</h1>
        <p>A daily, 5-minute dive written fresh from Wikipedia</p>
    </header>

    <main>
        <div class="filter-nav">
            <button class="filter-btn active" data-key="history" onclick="loadEntry('history')">On This Day (History)</button>
            <button class="filter-btn" data-key="featured" onclick="loadEntry('featured')">Featured Article</button>
        </div>

        <div id="content-card" class="card">
            <p class="muted">Loading…</p>
        </div>

        <p class="attribution">
            Adapted by AI from <a href="https://en.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a>
            articles, available under CC BY-SA 4.0.<br>
            <button class="link-btn" onclick="regenerate()">Regenerate today's digest</button> ·
            <button class="link-btn" onclick="changeKey()">Change API key</button>
        </p>
    </main>

    <script>
        // ================= Settings =================
        const MODEL = 'claude-haiku-5-5';
        const WORDS_PER_CARD = 1000;            // about 5 minutes of reading
        const SOURCE_WORDS = 3000;              // how much Wikipedia text to send to Claude
        const KEY_STORAGE = 'curiositySpark.apiKey';
        const CACHE_PREFIX = 'curiositySpark.digest.';

        const contentData = {};
        let activeKey = 'history';
        let timerInterval;
        let timeLeft = 300;

        class AuthError extends Error {}

        // ================= Helpers =================
        function escapeHTML(str = '') {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function localDateStr(d = new Date()) {
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function setCard(html) {
            document.getElementById('content-card').innerHTML = html;
        }

        function showNav(show) {
            document.querySelector('.filter-nav').style.display = show ? '' : 'none';
        }

        // ================= API key handling =================
        function showKeySetup(errorMsg = '') {
            showNav(false);
            setCard(`
                <h2 style="margin-top: 0;">Connect to Claude</h2>
                <p>This page uses Claude to turn today's Wikipedia articles into a 5-minute digest.
                   Paste your Anthropic API key to get started. It's stored only in this browser
                   and sent only to Anthropic.</p>
                ${errorMsg ? `<p class="error">${escapeHTML(errorMsg)}</p>` : ''}
                <input id="key-input" class="key-input" type="password" placeholder="sk-ant-..." autocomplete="off">
                <button class="timer-btn" onclick="saveKey()">Save and generate</button>
            `);
            document.getElementById('key-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') saveKey();
            });
        }

        function saveKey() {
            const value = document.getElementById('key-input').value.trim();
            if (!value) return;
            localStorage.setItem(KEY_STORAGE, value);
            init();
        }

        function changeKey() {
            localStorage.removeItem(KEY_STORAGE);
            showKeySetup();
        }

        function regenerate() {
            localStorage.removeItem(CACHE_PREFIX + localDateStr());
            init();
        }

        function clearOldDigests() {
            Object.keys(localStorage)
                .filter(k => k.startsWith(CACHE_PREFIX))
                .forEach(k => localStorage.removeItem(k));
        }

        // ================= Wikipedia =================
        async function fetchFeed(dateStr) {
            const [y, m, d] = dateStr.split('-');
            const res = await fetch(`https://en.wikipedia.org/api/rest_v1/feed/featured/${y}/${m}/${d}`);
            if (!res.ok) throw new Error(`Wikipedia feed returned ${res.status}`);
            return res.json();
        }

        async function fetchArticleText(title, maxWords) {
            const url = 'https://en.wikipedia.org/w/api.php?action=query&prop=extracts' +
                '&explaintext=1&exsectionformat=plain&redirects=1&format=json&origin=*' +
                `&titles=${encodeURIComponent(title)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Wikipedia article returned ${res.status}`);
            const json = await res.json();
            const text = Object.values(json.query.pages)[0].extract || '';
            const cutoff = text.search(/\n(See also|References|Notes|Citations|External links|Further reading)\s*\n/);
            const body = cutoff > 0 ? text.slice(0, cutoff) : text;
            return body.split(/\s+/).slice(0, maxWords).join(' ');
        }

        // ================= Claude =================
        async function askClaude(apiKey, title, context, source) {
            const system =
                'You write "The Curiosity Spark", a daily digest that turns Wikipedia articles into ' +
                'engaging 5-minute reads for curious adults. Use ONLY facts stated in the provided source text. ' +
                'Do not add facts from memory. Respond with a single JSON object and nothing else.';

            const prompt = `Article title: ${title}
Context: ${context}

<source>
${source}
</source>

Write a digest of this article as JSON with exactly this shape:
{
  "title": "a catchy title, under 10 words",
  "hook": "2-3 vivid sentences that make the reader want to keep going",
  "body": ["5 to 8 paragraphs totalling about ${WORDS_PER_CARD} words, telling the story in a lively, clear way"],
  "takeaway": "one memorable sentence someone could share at dinner",
  "quiz": {
    "question": "a question answerable from the body text",
    "options": [{"text": "...", "correct": true}, {"text": "...", "correct": false}, {"text": "...", "correct": false}],
    "explanation": "one sentence explaining the answer"
  }
}
Exactly one quiz option must be correct.`;

            const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json',
                    'anthropic-dangerous-direct-browser-access': 'true'
                },
                body: JSON.stringify({
                    model: MODEL,
                    max_tokens: 4000,
                    system,
                    messages: [{ role: 'user', content: prompt }]
                })
            });

            if (res.status === 401) {
                throw new AuthError('That API key was rejected. Please check it and try again.');
            }
            if (!res.ok) {
                const detail = (await res.text()).slice(0, 200);
                throw new Error(`Claude API error ${res.status}: ${detail}`);
            }

            const data = await res.json();
            const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
            const card = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));

            if (card.quiz && Array.isArray(card.quiz.options) &&
                card.quiz.options.filter(o => o.correct === true).length === 1) {
                shuffle(card.quiz.options);
            } else {
                card.quiz = null;
            }
            return card;
        }

        // ================= Build the digest =================
        async function makeCard(apiKey, kind, title, context) {
            const source = await fetchArticleText(title, SOURCE_WORDS);
            const ai = await askClaude(apiKey, title, context, source);
            return {
                ...ai,
                type: kind === 'history' ? 'history' : 'science',
                label: kind === 'history' ? 'On This Day' : "Today's Featured Article",
                link: `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`
            };
        }

        async function buildDigest(dateStr, apiKey) {
            let feed;
            try {
                feed = await fetchFeed(dateStr);
            } catch (err) {
                // Today's feed may not be ready yet; fall back to yesterday
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                feed = await fetchFeed(localDateStr(yesterday));
            }

            const seed = Math.floor(Date.parse(dateStr) / 86400000);
            const events = (feed.onthisday || []).filter(e => e.pages && e.pages.length);

            const jobs = {};
            if (events.length) {
                const ev = events[seed % events.length];
                jobs.history = makeCard(apiKey, 'history', ev.pages[0].title,
                    `This article is linked to an "On this day" event from ${ev.year}: ${ev.text}`);
            }
            if (feed.tfa) {
                jobs.featured = makeCard(apiKey, 'featured', feed.tfa.title,
                    "This is today's featured article on Wikipedia.");
            }

            const keys = Object.keys(jobs);
            const results = await Promise.allSettled(Object.values(jobs));
            const digest = { date: dateStr };
            results.forEach((r, i) => {
                if (r.status === 'fulfilled') digest[keys[i]] = r.value;
            });

            if (!digest.history && !digest.featured) {
                throw results.length ? results[0].reason : new Error('Wikipedia had no entries today.');
            }
            return digest;
        }

        // ================= Timer =================
        function startTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timer-display');
            const btn = document.getElementById('timer-btn');

            if (btn.innerText === 'Start Timer' || btn.innerText === 'Resume') {
                btn.innerText = 'Pause';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    const mins = Math.floor(timeLeft / 60);
                    const secs = timeLeft % 60;
                    display.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        display.innerText = 'Time up! Reading complete.';
                        btn.style.display = 'none';
                    }
                }, 1000);
            } else {
                btn.innerText = 'Resume';
            }
        }

        // ================= Quiz =================
        function handleQuizAnswer(btn, isCorrect) {
            const allButtons = btn.parentElement.querySelectorAll('.quiz-opt');
            allButtons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                allButtons.forEach(b => {
                    if (b.dataset.correct === 'true') b.classList.add('correct');
                });
            }

            const feedback = document.getElementById('quiz-feedback');
            feedback.innerText = contentData[activeKey].quiz.explanation || '';
            feedback.style.color = isCorrect ? '#16a34a' : '#dc2626';
        }

        // ================= Render =================
        function loadEntry(key) {
            activeKey = key;
            document.querySelectorAll('.filter-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.key === key)
            );

            clearInterval(timerInterval);
            timeLeft = 300;

            const data = contentData[key];
            if (!data) {
                setCard(`<p>This entry isn't available today. Try the other tab!</p>`);
                return;
            }

            const bodyHTML = (data.body || []).map(p => `<p>${escapeHTML(p)}</p>`).join('');

            const quizHTML = data.quiz ? `
                <div class="quiz-box">
                    <h3 style="margin: 0 0 0.5rem 0; font-size: 1rem;">🧠 Quick Knowledge Check</h3>
                    <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">${escapeHTML(data.quiz.question)}</p>
                    <div class="quiz-options">
                        ${data.quiz.options.map(opt => `
                            <button class="quiz-opt" data-correct="${opt.correct === true}"
                                    onclick="handleQuizAnswer(this, ${opt.correct === true})">
                                ${escapeHTML(opt.text)}
                            </button>`).join('')}
                    </div>
                    <div id="quiz-feedback" class="feedback"></div>
                </div>` : '';

            setCard(`
                <span class="badge ${data.type}">${escapeHTML(data.label)}</span>
                <h2 style="margin: 0 0 1rem 0; font-size: 1.5rem;">${escapeHTML(data.title)}</h2>

                <div class="timer-container">
                    <span>⏱️ 5-Min Reading Focus: <strong id="timer-display">5:00</strong></span>
                    <button id="timer-btn" class="timer-btn" onclick="startTimer()">Start Timer</button>
                </div>

                <div class="section-title">The Hook</div>
                <div class="hook-box">${escapeHTML(data.hook)}</div>

                <div class="section-title">The Deep Dive</div>
                <div class="deep-dive">${bodyHTML}</div>

                <div class="section-title">The Dinner Table Takeaway</div>
                <p style="margin: 0.5rem 0; font-weight: 500;">${escapeHTML(data.takeaway)}</p>

                <p class="read-more"><a href="${escapeHTML(data.link)}" target="_blank" rel="noopener">
                    Read the original article on Wikipedia →</a></p>

                ${quizHTML}
            `);
        }

        // ================= Start up =================
        async function init() {
            const apiKey = localStorage.getItem(KEY_STORAGE);
            if (!apiKey) return showKeySetup();

            showNav(true);
            const today = localDateStr();
            let digest;

            const cached = localStorage.getItem(CACHE_PREFIX + today);
            if (cached) {
                digest = JSON.parse(cached);
            } else {
                showNav(false);
                setCard(`<p class="muted">Brewing today's digest… this usually takes 15–40 seconds,
                         and only happens once per day.</p>`);
                try {
                    digest = await buildDigest(today, apiKey);
                    clearOldDigests();
                    localStorage.setItem(CACHE_PREFIX + today, JSON.stringify(digest));
                } catch (err) {
                    if (err instanceof AuthError) {
                        localStorage.removeItem(KEY_STORAGE);
                        return showKeySetup(err.message);
                    }
                    console.error(err);
                    setCard(`
                        <p class="error">Couldn't build today's digest: ${escapeHTML(err.message)}</p>
                        <button class="timer-btn" onclick="init()">Try again</button>
                    `);
                    return;
                }
                showNav(true);
            }

            contentData.history = digest.history || null;
            contentData.featured = digest.featured || null;
            loadEntry(contentData.history ? 'history' : 'featured');
        }

        init();
    </script>
</body>
</html>
