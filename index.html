<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Curiosity Spark - Daily Deep Dive</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-history: #b45309;
            --accent-science: #0369a1;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        main {
            max-width: 650px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .filter-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--text-main);
            color: white;
            border-color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .badge.history { background: #fef3c7; color: var(--accent-history); }
        .badge.science { background: #e0f2fe; color: var(--accent-science); }

        .timer-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .timer-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .hook-box {
            font-style: italic;
            font-size: 1.1rem;
            color: var(--text-main);
            border-left: 3px solid var(--border-color);
            padding-left: 1rem;
            margin: 1rem 0;
        }

        .deep-dive p { margin: 0 0 1rem 0; }

        .quiz-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            margin-top: 2rem;
        }

        .quiz-options {
            display: grid;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .quiz-opt {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .quiz-opt:hover { background: #f1f5f9; }

        .quiz-opt.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #14532d;
        }

        .quiz-opt.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        .feedback {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .read-more a, .attribution a { color: var(--accent-science); }

        .attribution {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .error { color: #dc2626; font-size: 0.9rem; }
        .muted { color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>The Curiosity Spark</h1>
        <p>A daily, 5-minute dive written fresh from Wikipedia</p>
    </header>

    <main>
        <div class="filter-nav">
            <button class="filter-btn active" data-key="history" onclick="loadEntry('history')">On This Day (History)</button>
            <button class="filter-btn" data-key="featured" onclick="loadEntry('featured')">Featured Article</button>
        </div>

        <div id="content-card" class="card">
            <p class="muted">Loading today's digest…</p>
        </div>

        <p class="attribution">
            <span id="edition"></span>
            Adapted by AI from <a href="https://en.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a>
            articles, available under CC BY-SA 4.0.
        </p>
    </main>

    <script>
        const contentData = {};
        let activeKey = 'history';
        let timerInterval;
        let timeLeft = 300;

        function escapeHTML(str = '') {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function setCard(html) {
            document.getElementById('content-card').innerHTML = html;
        }

        // ---------- Timer ----------
        function startTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timer-display');
            const btn = document.getElementById('timer-btn');

            if (btn.innerText === 'Start Timer' || btn.innerText === 'Resume') {
                btn.innerText = 'Pause';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    const mins = Math.floor(timeLeft / 60);
                    const secs = timeLeft % 60;
                    display.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        display.innerText = 'Time up! Reading complete.';
                        btn.style.display = 'none';
                    }
                }, 1000);
            } else {
                btn.innerText = 'Resume';
            }
        }

        // ---------- Quiz ----------
        function handleQuizAnswer(btn, isCorrect) {
            const allButtons = btn.parentElement.querySelectorAll('.quiz-opt');
            allButtons.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                allButtons.forEach(b => {
                    if (b.dataset.correct === 'true') b.classList.add('correct');
                });
            }

            const feedback = document.getElementById('quiz-feedback');
            feedback.innerText = contentData[activeKey].quiz.explanation || '';
            feedback.style.color = isCorrect ? '#16a34a' : '#dc2626';
        }

        // ---------- Render ----------
        function loadEntry(key) {
            activeKey = key;
            document.querySelectorAll('.filter-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.key === key)
            );

            clearInterval(timerInterval);
            timeLeft = 300;

            const data = contentData[key];
            if (!data) {
                setCard(`<p>This entry isn't available today. Try the other tab!</p>`);
                return;
            }

            const bodyHTML = (data.body || []).map(p => `<p>${escapeHTML(p)}</p>`).join('');

            const quizHTML = data.quiz ? `
                <div class="quiz-box">
                    <h3 style="margin: 0 0 0.5rem 0; font-size: 1rem;">🧠 Quick Knowledge Check</h3>
                    <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">${escapeHTML(data.quiz.question)}</p>
                    <div class="quiz-options">
                        ${data.quiz.options.map(opt => `
                            <button class="quiz-opt" data-correct="${opt.correct === true}"
                                    onclick="handleQuizAnswer(this, ${opt.correct === true})">
                                ${escapeHTML(opt.text)}
                            </button>`).join('')}
                    </div>
                    <div id="quiz-feedback" class="feedback"></div>
                </div>` : '';

            setCard(`
                <span class="badge ${data.type}">${escapeHTML(data.label)}</span>
                <h2 style="margin: 0 0 1rem 0; font-size: 1.5rem;">${escapeHTML(data.title)}</h2>

                <div class="timer-container">
                    <span>⏱️ 5-Min Reading Focus: <strong id="timer-display">5:00</strong></span>
                    <button id="timer-btn" class="timer-btn" onclick="startTimer()">Start Timer</button>
                </div>

                <div class="section-title">The Hook</div>
                <div class="hook-box">${escapeHTML(data.hook)}</div>

                <div class="section-title">The Deep Dive</div>
                <div class="deep-dive">${bodyHTML}</div>

                <div class="section-title">The Dinner Table Takeaway</div>
                <p style="margin: 0.5rem 0; font-weight: 500;">${escapeHTML(data.takeaway)}</p>

                <p class="read-more"><a href="${escapeHTML(data.link)}" target="_blank" rel="noopener">
                    Read the original article on Wikipedia →</a></p>

                ${quizHTML}
            `);
        }

        // ---------- Start up ----------
        async function init() {
            try {
                const res = await fetch('digest.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error(`digest.json returned ${res.status}`);
                const digest = await res.json();

                contentData.history = digest.history || null;
                contentData.featured = digest.featured || null;

                if (digest.date) {
                    const nice = new Date(digest.date + 'T12:00:00Z').toLocaleDateString(undefined, {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                    document.getElementById('edition').innerText = `Edition: ${nice}. `;
                }

                loadEntry(contentData.history ? 'history' : 'featured');
            } catch (err) {
                console.error(err);
                setCard(`<p class="error">Today's digest isn't available yet. Please check back soon.</p>`);
            }
        }

        init();
    </script>
</body>
</html>
